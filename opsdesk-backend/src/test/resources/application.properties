# =============================================================================
#  测试专用配置
#
#  ⚠️ 这里是 application.properties（不是 .yml），且只在 src/test/resources 下：
#     Spring Boot 会把 classpath 上的 application.properties 与主 resources 的
#     application.yml **同时加载**，properties 优先级更高 —— 所以这里只写
#     「测试里必须改掉」的那几项，其余继续用主 application.yml，不复制整份配置。
# =============================================================================

# ---- 关闭 SLA 定时扫描（工单 D5-03，§9.5）----
# @Scheduled 一旦生效，测试 JVM 里就会起一个后台线程每 5 分钟扫一次库。
# 它**走自己的事务、不回滚**，会把种子工单 1/2 的 sla_resolution_state
# 从 NORMAL / WARNING 改写成 BREACHED（种子 deadline 是 2026-10-06，跑测试时早已过期），
# 从而打红 TicketQueryServiceTest 里那几条精确断言。
#
# 扫描逻辑本身由 SlaScanServiceTest 直接调用 scan() 验证 ——
# 验收要的是「扫描方法」的行为，不是「调度器会不会触发」，所以关掉调度器不影响验收。
opsdesk.sla.scan.enabled=false
