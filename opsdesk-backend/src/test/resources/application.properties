# =============================================================================
#  测试专用配置
#
#  ⚠️ 这里是 application.properties（不是 .yml），且只在 src/test/resources 下：
#     Spring Boot 会把 classpath 上的 application.properties 与主 resources 的
#     application.yml **同时加载**，properties 优先级更高 —— 所以这里只写
#     「测试里必须改掉」的那几项，其余继续用主 application.yml，不复制整份配置。
# =============================================================================

# ---- 关闭 SLA 定时扫描（工单 D5-03，§9.5）----
# @Scheduled 一旦生效，测试 JVM 里就会起一个后台线程每 5 分钟扫一次库。
# 它**走自己的事务、不回滚**，会把种子工单 1/2 的 sla_resolution_state
# 从 NORMAL / WARNING 改写成 BREACHED（种子 deadline 是 2026-10-06，跑测试时早已过期），
# 从而打红 TicketQueryServiceTest 里那几条精确断言。
#
# 扫描逻辑本身由 SlaScanServiceTest 直接调用 scan() 验证 ——
# 验收要的是「扫描方法」的行为，不是「调度器会不会触发」，所以关掉调度器不影响验收。
opsdesk.sla.scan.enabled=false

# ---- 关闭 Outbox 定时投递（工单 D9-01，§13.5）----
# 同上：@Scheduled 会在测试 JVM 里真跑、真提交，把测试造出来的 PENDING 记录投出去并改成 SENT，
# 打红「PENDING → SENT / retry_count 递增」这类精确断言。
# 投递逻辑由 OutboxPublisherTest 直接调 publishPending() 验证 ——
# 验收要的是「投递方法」的行为，不是「调度器会不会触发」，关掉不影响验收。
opsdesk.outbox.publish.enabled=false

# ---- 关闭 @RabbitListener 容器的自动启动（工单 D9-02）----
# ⚠️ Spring 测试框架会**缓存**多个 ApplicationContext 并让它们**同时存活**。
#    D9-02 起有了消费者，每个缓存上下文都会跑一份自己的 @RabbitListener 容器，
#    而它们监听的是**同一批队列** → 同一份队列上出现多个竞争消费者。
#    症状：只在「全量跑」时随机红 —— 你在用例里 mock 掉的监听器根本没收到消息，
#    因为消息被**另一个上下文的真实监听器**先消费掉了（单独跑这个类时只有一个上下文，所以是绿的）。
#
#    所以测试里一律不自动启动容器，由需要它的用例（AbstractMqIntegrationTest 的子类）
#    在 @BeforeEach 显式启动、@AfterEach 停掉 —— 任意时刻只有一个上下文的容器在跑。
spring.rabbitmq.listener.simple.auto-startup=false
