<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730">
  <title>AI Agent + Tool + RAG 流程</title>
  <desc>用户提问后限流校验、在请求线程捕获身份、进入最多 10 轮的工具循环，工具内部复用数据范围校验与 RAG 检索</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    .title { font-size: 17px; font-weight: 600; fill: #1F2937; }
    .th { font-size: 14px; font-weight: 500; fill: #1F2937; }
    .ts { font-size: 12px; fill: #6B7280; }
    .tm { font-size: 13px; font-weight: 500; fill: #1F2937; }
    .tms { font-size: 11px; fill: #6B7280; }
    .note { font-size: 12px; fill: #9CA3AF; }
  </style>

  <rect width="900" height="730" fill="#FFFFFF"/>
  <text class="title" x="450" y="28" text-anchor="middle">AI Agent + Tool + RAG 流程</text>

  <rect x="260" y="50" width="380" height="60" rx="10" fill="#F9FAFB" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="th" x="450" y="74" text-anchor="middle">用户提问</text>
  <text class="ts" x="450" y="94" text-anchor="middle">POST /api/ai/chat</text>

  <path d="M450 110L450 146" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="150" width="380" height="48" rx="10" fill="#F9FAFB" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="th" x="450" y="174" text-anchor="middle">限流 · 20 次 / 分钟 / 用户</text>

  <path d="M640 174L676 174" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="note" x="658" y="164" text-anchor="middle">超限</text>
  <rect x="680" y="150" width="180" height="48" rx="10" fill="#F9FAFB" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="770" y="174" text-anchor="middle">42900</text>

  <path d="M450 198L450 234" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="238" width="380" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="450" y="262" text-anchor="middle">捕获当前用户身份</text>
  <text class="ts" x="450" y="282" text-anchor="middle">请求线程 · 含部门与权限</text>

  <path d="M450 298L450 334" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="338" width="380" height="60" rx="10" fill="#F9FAFB" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="th" x="450" y="362" text-anchor="middle">工具循环 · 最多 10 轮</text>
  <text class="ts" x="450" y="382" text-anchor="middle">调用对话模型</text>

  <path d="M450 398L450 434" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="438" width="380" height="48" rx="10" fill="#F9FAFB" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="th" x="450" y="462" text-anchor="middle">模型要求调用工具？</text>
  <text class="note" x="466" y="500" text-anchor="middle">是</text>

  <path d="M450 486L450 508" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M157 508L712 508" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M157 508L157 526" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M342 508L342 526" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M527 508L527 526" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M712 508L712 526" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="530" width="175" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="tm" x="157" y="554" text-anchor="middle">queryTicket</text>
  <text class="tms" x="157" y="574" text-anchor="middle">数据范围校验</text>

  <rect x="255" y="530" width="175" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="tm" x="342" y="554" text-anchor="middle">queryMyTickets</text>
  <text class="tms" x="342" y="574" text-anchor="middle">无参数 · 仅本人</text>

  <rect x="440" y="530" width="175" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="tm" x="527" y="554" text-anchor="middle">queryKnowledge</text>
  <text class="tms" x="527" y="574" text-anchor="middle">RAG 语义检索</text>

  <rect x="625" y="530" width="175" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="tm" x="712" y="554" text-anchor="middle">createTicket</text>
  <text class="tms" x="712" y="574" text-anchor="middle">以当前用户身份建单</text>

  <path d="M157 598L712 598" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <path d="M450 598L450 636" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M640 462L830 462L830 670L644 670" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="note" x="690" y="454" text-anchor="middle">否</text>

  <path d="M70 564L50 564L50 368L256 368" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="note" x="36" y="466" text-anchor="middle" transform="rotate(-90 36 466)">未满 10 轮则继续</text>

  <rect x="260" y="640" width="380" height="60" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="450" y="664" text-anchor="middle">返回回答</text>
  <text class="ts" x="450" y="684" text-anchor="middle">answer + toolCalls + sessionId</text>
</svg>
